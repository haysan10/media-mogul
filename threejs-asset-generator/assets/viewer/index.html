<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Viewer</title>
<!-- three is pinned to the same version as package.json. Needs internet for the CDN. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; --bg:#14161b; --panel:#1b1e25; --line:#2a2e38; --text:#e6e8ee; --muted:#8b92a3; --accent:#6ea8ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display:grid; grid-template-columns: 230px 1fr 290px; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:14px; }
  #panel { border-right:0; border-left:1px solid var(--line); }
  h1 { font-size:14px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  h2 { font-size:16px; margin:0 0 2px; }
  .muted { color:var(--muted); }
  input[type=search] { width:100%; padding:7px 9px; margin-bottom:10px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; }
  .cat { margin:12px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .item { display:block; width:100%; text-align:left; padding:6px 9px; margin:1px 0; background:none; border:0; border-radius:6px; color:var(--text); cursor:pointer; font:inherit; }
  .item:hover { background:#252a35; }
  .item.active { background:var(--accent); color:#0b1220; font-weight:600; }
  main { position:relative; min-width:0; }
  canvas { width:100%; height:100%; display:block; }
  #hud { position:absolute; left:12px; bottom:10px; color:var(--muted); font-size:12px; pointer-events:none; text-shadow:0 1px 2px #000; }
  #err { position:absolute; inset:20px; display:none; padding:16px; background:#3a1a1f; border:1px solid #7a2b36; border-radius:8px; white-space:pre-wrap; overflow:auto; }
  .stats { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:10px 0 14px; padding:9px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .stats span:nth-child(odd) { color:var(--muted); }
  .row { margin:9px 0; }
  .row label { display:flex; justify-content:space-between; margin-bottom:3px; }
  .row input[type=range] { width:100%; accent-color:var(--accent); }
  .row input[type=color] { width:100%; height:28px; background:none; border:1px solid var(--line); border-radius:6px; padding:2px; }
  .row select { width:100%; padding:6px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  button.b { padding:6px 10px; background:#252a35; color:var(--text); border:1px solid var(--line); border-radius:6px; cursor:pointer; font:inherit; }
  button.b:hover { border-color:var(--accent); }
  button.b.on { background:var(--accent); color:#0b1220; border-color:var(--accent); }
  .sec { margin-top:16px; padding-top:10px; border-top:1px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: 150px 1fr 220px; } aside { border:0; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Assets</h1>
    <input id="search" type="search" placeholder="Search…">
    <div id="list"></div>
  </aside>
  <main>
    <canvas id="c"></canvas>
    <div id="hud">drag = orbit · wheel = zoom · right-drag = pan</div>
    <div id="err"></div>
  </main>
  <aside id="panel">
    <h2 id="title">—</h2>
    <div id="desc" class="muted"></div>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="b" id="bRand">🎲 Seed</button>
      <button class="b" id="bReset">Reset</button>
      <button class="b" id="bWire">Wireframe</button>
      <button class="b on" id="bSpin">Turntable</button>
      <button class="b on" id="bPlay">Animate</button>
    </div>
    <div id="states"></div>
    <div class="sec">Options</div>
    <div id="opts"></div>
    <div class="sec">Output</div>
    <div class="btns">
      <button class="b" id="bGlb">⬇ GLB</button>
      <button class="b" id="bPng">⬇ PNG</button>
      <button class="b" id="bCopy">Copy code</button>
    </div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const $ = (id) => document.getElementById(id);
const errBox = $('err');
const showError = (e) => { errBox.style.display = 'block'; errBox.textContent = String(e?.stack ?? e); console.error(e); };
window.addEventListener('error', (e) => showError(e.error ?? e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason));

let registry;
try {
  ({ registry } = await import('../registry.js'));
} catch (e) {
  showError(`Could not load ../registry.js\n\n${e}\n\nRun "npm run registry" (or "npm run serve") and open this page through http://localhost:5173/viewer/ — not file://.`);
  throw e;
}

/* ---------------------------------------------------------------- scene */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1c2027');
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight('#c9dcff', '#3b3a44', 1.1));
const sun = new THREE.DirectionalLight('#fff3df', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(60, 48),
  new THREE.MeshStandardMaterial({ color: '#2a2f3a', roughness: 1 }),
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, '#4a5160', '#343a47');
grid.position.y = 0.001;
scene.add(grid);

function resize() {
  const { clientWidth: w, clientHeight: h } = canvas;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

/* ---------------------------------------------------------------- state */
let entry = null;
let options = {};
let obj = null;
let playing = true;
let wire = false;
let rebuildQueued = false;

/* ------------------------------------------------------------ build list */
function buildList(filter = '') {
  const list = $('list');
  list.innerHTML = '';
  const q = filter.trim().toLowerCase();
  const byCat = {};
  for (const a of registry) {
    const hay = `${a.meta.id} ${a.meta.name} ${(a.meta.tags ?? []).join(' ')}`.toLowerCase();
    if (q && !hay.includes(q)) continue;
    (byCat[a.meta.category] ??= []).push(a);
  }
  for (const cat of Object.keys(byCat).sort()) {
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = cat;
    list.append(h);
    for (const a of byCat[cat]) {
      const b = document.createElement('button');
      b.className = 'item' + (entry === a ? ' active' : '');
      b.textContent = a.meta.name;
      b.onclick = () => select(a);
      list.append(b);
    }
  }
  if (!registry.length) list.innerHTML = '<div class="muted">No assets yet.<br>Run <code>npm run new</code>.</div>';
}
$('search').addEventListener('input', (e) => buildList(e.target.value));

/* ---------------------------------------------------------- option panel */
function buildOptions() {
  const box = $('opts');
  box.innerHTML = '';
  const spec = entry.meta.options ?? {};
  for (const [key, s] of Object.entries(spec)) {
    const row = document.createElement('div');
    row.className = 'row';
    const val = options[key];
    if (s.type === 'number') {
      row.innerHTML = `<label><span>${key}</span><span class="muted"></span></label><input type="range" min="${s.min}" max="${s.max}" step="${s.step ?? 0.01}">`;
      const input = row.querySelector('input');
      const out = row.querySelector('.muted');
      input.value = val;
      out.textContent = val;
      input.oninput = () => { options[key] = Number(input.value); out.textContent = input.value; queueRebuild(); };
    } else if (s.type === 'color') {
      row.innerHTML = `<label><span>${key}</span></label><input type="color">`;
      const input = row.querySelector('input');
      input.value = new THREE.Color(val).getHexString().replace(/^/, '#');
      input.oninput = () => { options[key] = input.value; queueRebuild(); };
    } else if (s.type === 'boolean') {
      row.innerHTML = `<label><span>${key}</span><input type="checkbox"></label>`;
      const input = row.querySelector('input');
      input.checked = !!val;
      input.onchange = () => { options[key] = input.checked; queueRebuild(); };
    } else if (s.type === 'select') {
      row.innerHTML = `<label><span>${key}</span></label><select></select>`;
      const sel = row.querySelector('select');
      for (const v of s.values ?? []) sel.add(new Option(v, v, false, v === val));
      sel.onchange = () => { options[key] = sel.value; queueRebuild(); };
    }
    box.append(row);
  }
}

/* ---------------------------------------------------------------- assets */
function applyWire() {
  obj?.traverse((o) => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.wireframe = wire; });
  });
}

function frame() {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z, 0.5);
  controls.target.copy(center);
  const dist = r * 1.9;
  camera.position.set(center.x + dist * 0.8, center.y + dist * 0.55, center.z + dist);
  camera.near = r / 100;
  camera.far = r * 100;
  camera.updateProjectionMatrix();
  sun.position.set(center.x + r * 1.2, r * 2.2, center.z + r * 0.9);
  sun.target.position.copy(center);
  const s = sun.shadow.camera;
  s.left = s.bottom = -r * 1.6;
  s.right = s.top = r * 1.6;
  s.near = 0.1;
  s.far = r * 8;
  s.updateProjectionMatrix();
  controls.update();
}

function rebuild({ reframe = false } = {}) {
  const prevState = obj?.userData.getState?.();
  if (obj) {
    scene.remove(obj);
    obj.userData.dispose?.();
    obj = null;
  }
  errBox.style.display = 'none';
  try {
    obj = entry.create({ ...options });
  } catch (e) {
    showError(e);
    return;
  }
  scene.add(obj);
  if (prevState && obj.userData.states?.includes(prevState)) obj.userData.setState(prevState);
  applyWire();
  if (reframe) frame();
  renderStats();
  renderStates();
}

function queueRebuild() {
  if (rebuildQueued) return;
  rebuildQueued = true;
  requestAnimationFrame(() => { rebuildQueued = false; rebuild(); });
}

function renderStats() {
  const s = obj.userData.stats;
  const budget = entry.meta.triangleBudget;
  const f = (n) => n.toFixed(2);
  $('stats').innerHTML = `
    <span>Triangles</span><span>${s.triangles}${budget ? ` / ${budget}` : ''}</span>
    <span>Size (m)</span><span>${s.size.map(f).join(' × ')}</span>
    <span>Meshes</span><span>${s.meshes}${s.points ? ` · ${s.points} pts` : ''}</span>`;
}

function renderStates() {
  const box = $('states');
  box.innerHTML = '';
  const states = obj?.userData.states;
  if (!states?.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'btns';
  const label = document.createElement('span');
  label.className = 'muted';
  label.textContent = 'state:';
  wrap.append(label);
  for (const name of states) {
    const b = document.createElement('button');
    b.className = 'b' + (obj.userData.getState() === name ? ' on' : '');
    b.textContent = name;
    b.onclick = () => { obj.userData.setState(name); renderStates(); };
    wrap.append(b);
  }
  box.append(wrap);
}

function select(a) {
  entry = a;
  options = { ...a.meta.defaults };
  location.hash = a.meta.id;
  $('title').textContent = a.meta.name;
  $('desc').textContent = a.meta.description ?? '';
  buildList($('search').value);
  buildOptions();
  rebuild({ reframe: true });
}

/* --------------------------------------------------------------- buttons */
const toggle = (id, on) => $(id).classList.toggle('on', on);
$('bRand').onclick = () => {
  if (!entry.meta.options?.seed) return;
  options.seed = Math.floor(Math.random() * 9999); // viewer only — assets never use Math.random()
  buildOptions();
  rebuild();
};
$('bReset').onclick = () => { options = { ...entry.meta.defaults }; buildOptions(); rebuild({ reframe: true }); };
$('bWire').onclick = () => { wire = !wire; toggle('bWire', wire); applyWire(); };
$('bSpin').onclick = () => { controls.autoRotate = !controls.autoRotate; toggle('bSpin', controls.autoRotate); };
$('bPlay').onclick = () => { playing = !playing; toggle('bPlay', playing); };

const download = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('bPng').onclick = () => {
  renderer.render(scene, camera);
  canvas.toBlob((b) => download(b, `${entry.meta.id}.png`));
};
$('bGlb').onclick = () => {
  const exportRoot = obj;
  new GLTFExporter().parse(
    exportRoot,
    (buf) => download(new Blob([buf], { type: 'model/gltf-binary' }), `${entry.meta.id}.glb`),
    (e) => showError(e),
    { binary: true, onlyVisible: true },
  );
};
$('bCopy').onclick = async () => {
  const changed = Object.fromEntries(Object.entries(options).filter(([k, v]) => v !== entry.meta.defaults[k]));
  const code = `import { create } from './registry.js';\n\nconst asset = create('${entry.meta.id}', ${JSON.stringify(changed)});\nscene.add(asset);\n// in your render loop:  asset.userData.update?.(clock.elapsedTime, clock.getDelta());`;
  try { await navigator.clipboard.writeText(code); $('bCopy').textContent = 'Copied ✓'; }
  catch { prompt('Copy this code:', code); }
  setTimeout(() => ($('bCopy').textContent = 'Copy code'), 1200);
};

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) { t += dt; obj?.userData.update?.(t, dt); }
  controls.update();
  renderer.render(scene, camera);
});

/* ------------------------------------------------------------------ init */
buildList();
resize();
const wanted = registry.find((a) => a.meta.id === location.hash.slice(1)) ?? registry[0];
if (wanted) select(wanted);
</script>
</body>
</html>
